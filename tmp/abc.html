<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>广州一日游攻略</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 1em 0;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .card {
            background: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            border-radius: 4px;
        }
        .card h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        footer {
            text-align: center;
            padding: 1em;
            background: #ecf0f1;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>广州一日深度游</h1>
    </header>
    <div class="container">
        <div class="card">
            <h2>上午：广州塔 & 珠江夜游</h2>
            <img src="https://picsum.photos/600/400?random=1" alt="广州塔">
            <p>建议清晨登塔俯瞰城市全景，中午可在塔下用餐。傍晚可参加珠江夜游船。</p>
        </div>

        <div class="card">
            <h2>中午：老字号美食</h2>
            <img src="https://picsum.photos/600/400?random=2" alt="美食">
            <p>推荐到「陶陶居」品尝虾饺、肠粉，或「点都德」体验早茶文化。</p>
        </div>

        <div class="card">
            <h2>下午：陈家祠 & 上下九</h2>
            <img src="https://picsum.photos/600/400?random=3" alt="陈家祠">
            <p>参观岭南建筑瑰宝陈家祠，随后步行至上下九步行街购物，品尝双皮奶、姜撞奶。</p>
        </div>

        <div class="card">
            <h2>交通贴士</h2>
            <ul>
                <li>地铁：3号线至广州塔站</li>
                <li>公交：多条线路可达陈家祠</li>
                <li>打车：使用高德地图一键叫车</li>
            </ul>
        </div>
    </div>
    <footer>
        <p>© 2023 广州旅游攻略 | 设计：<a href="https://www.amap.com">高德地图</a></p>
    </footer>
</body>
</html>
