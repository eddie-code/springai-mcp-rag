spring:
  application:
    name: spring-ai-mcp-client
  profiles:
    active: dev
  ai:
    mcp:
      client:
        connection-timeout: 120s  # 增加到120秒
        request-timeout: 60s     # 增加到60秒
        enabled: true
        name: spring-ai-mcp-client
        type: ASYNC
        sse:
          connections:
            server1:
              url: https://mcp.amap.com
              sse-endpoint: /sse?key=${GAODE_SSE_MCP_KEY}
            server2:
              url: http://localhost:9060
              sse-endpoint: /sse
        stdio:
          servers-configuration: classpath:mcp-server.json
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        options:
          model: ${OPENAI_MODEL}
#      embedding:
#        options:
#          model: text-embedding-v2
    embedding:
      onnx:
        enabled: true
        options:
          model: all-MiniLM-L6-v2
        transformer:
          tokenizer:
            uri: classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json
          onnx:
            model-uri: classpath:/onnx/all-MiniLM-L6-v2/model.onnx
    vectorstore:
      redis:
        # 必须启动时候自动创建'索引', 不然会出现查询不到数据等问题
        initialize-schema: true
        index-name: lee-vectorstore
        prefix: 'embedding:'
  data:
    redis:
      host: 192.168.56.101
      port: 6379
      password: redis123
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

logging:
  level:
    root: info

internet:
  websearch:
    searxng:
      url: http://192.168.56.101:6080/search
      count: 10  # 15-25