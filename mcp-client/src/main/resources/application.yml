spring:
  application:
    name: spring-ai-mcp-client
  profiles:
    active: dev
  ai:
    mcp:
      client:
        enabled: true
        version: 1.0.0
        request-timeout: 30s
        name: spring-ai-mcp-client
        type: ASYNC
        sse:
          connections:
            server1:
              url: https://mcp.amap.com
              sse-endpoint: /sse?key=${GAODE_SSE_MCP_KEY}
            server2:
              url: http://localhost:9060 # 本地的mcp-server
              sse-endpoint: /sse
        stdio:
          servers-configuration: classpath:mcp-server.json
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        options:
          model: ${OPENAI_MODEL}
      # 明确禁用 OpenAI Embeddings，使用 ONNX
      embedding:
        enabled: false
    # ONNX Transformers Embeddings 配置
    embedding:
      onnx:
        enabled: true
      transformer:
        tokenizer:
          uri: "classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json"
        onnx:
          model-uri: "classpath:/onnx/all-MiniLM-L6-v2/model.onnx"
    vectorstore:
      redis:
        # 必须启动时候自动创建'索引', 不然会出现查询不到数据等问题
        initialize-schema: true
        index-name: lee-vectorstore
        prefix: 'embedding:'
  data:
    redis:
      host: 192.168.56.101
      port: 6379
      password: redis123
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

logging:
  level:
    root: info

internet:
  websearch:
    searxng:
      url: http://192.168.56.101:6080/search
      count: 10  # 15-25